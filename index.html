<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Akeem's app</title>
  <style>
    .matrix {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .quadrant {
      border: 2px solid #333;
      padding: 20px;
    }
    .q1 {
      background-color: pink;
    }
    .q2 {
      background-color: orange;
    }
    .q3 {
      background-color: lightblue;
    }
    .q4 {
      background-color: lightgreen;
    }
  </style>
</head>
<body>
  <h1>Eisenhower Matrix</h1>
  <div class="matrix">
    <div class="quadrant q1">Urgent & Important</div>
    <div class="quadrant q2">Not Urgent & Important</div>
    <div class="quadrant q3">Urgent & Not Important</div>
    <div class="quadrant q4">Not Urgent & Not Important</div>
  </div>
</body>
</html>
