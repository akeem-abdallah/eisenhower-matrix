<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Akeem's app</title>
    <style>

        .matrix {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .quadrant {
            border: 2px solid #333;
            padding: 20px;
        }

        .q1 {
            background-color: pink;
        }

        .q2 {
            background-color: orange;
        }

        .q3 {
            background-color: lightblue;
        }

        .q4 {
            background-color: lightgreen;
        }

        .entry {
            display: flex
        }

        .completed {
            text-decoration: line-through
        }

    </style>
</head>
<body>
    <h1>Eisenhower Matrix</h1>
    <div class="controls">
        <input type="text" id="entry-text" placeholder="Add a task or habit">
        <select id="entry-quadrant">
            <option value="q1">Urgent &amp; Important</option>
            <option value="q2">Not Urgent &amp; Important</option>
            <option value="q3">Urgent &amp; Not Important</option>
            <option value="q4">Not Urgent &amp; Not Important</option>
        </select>
        <button id="add-btn">Add</button>
    </div>
    <div class="matrix">
        <div class="quadrant q1">Urgent & Important</div>
        <div class="quadrant q2">Not Urgent & Important</div>
        <div class="quadrant q3">Urgent & Not Important</div>
        <div class="quadrant q4">Not Urgent & Not Important</div>
    </div>

    <script>

        fetch("/api/tasks", {method: "GET"})
            .then(response => response.json())
            .then(data => {
                data.forEach(function (task) {
                    let entry = createEntry(task)
                    let correctQuadrant = document.querySelector("." + task.quadrant)
                    correctQuadrant.appendChild(entry)
                })
           })

        function createEntry(task) {

            let entry = document.createElement("div")
            let checkbox = document.createElement("input")
            let taskText = document.createElement("div")

            entry.className = "entry"
            checkbox.type = "checkbox"
            checkbox.dataset.id = task.id
            checkbox.checked = task.completed
            taskText.textContent = task.text
            if (task.completed) { taskText.classList.add("completed") }
            entry.appendChild(taskText)
            entry.appendChild(checkbox)
            checkbox.addEventListener("change", function () {
                taskText.classList.toggle("completed")

                fetch("/api/tasks/" + checkbox.dataset.id, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ completed: checkbox.checked })
                })
            })

            let deleteButton = document.createElement("button")
            deleteButton.textContent = "Delete"
            entry.appendChild(deleteButton)
            deleteButton.addEventListener("click", function () {
                fetch("/api/tasks/" + checkbox.dataset.id, { method: "DELETE" })
                entry.remove()
            })

            return entry

        }

        const button = document.getElementById("add-btn")
        const entryQuadrant = document.getElementById("entry-quadrant")
        const entryText = document.getElementById("entry-text")

        button.addEventListener("click", function () {

            if (entryText.value.trim() === "") { return }
            let taskData = { text: entryText.value, quadrant: entryQuadrant.value, completed: false }

            fetch("/api/tasks", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(taskData)
            })
                .then(response => response.json())
                .then(result => {
                    taskData.id = result.id
                    let entry = createEntry(taskData)
                    let correctQuadrant = document.querySelector("." + entryQuadrant.value)
                    correctQuadrant.appendChild(entry)
                })

        })

    </script>
</body>
</html>
